services:
  db:
    image: postgres:15
    container_name: async_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: document_db
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: async_redis
    ports:
      # We changed the left number from 6379 to 6380!
      - "6380:6379"